<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">FLUXATLAS architecture</title><desc id="d">Independent OpenMC references feed reserved geometry partitions. Training-only low and selected high fields train a residual neural ensemble. Exact uncollided physics is added to its learned scattered field. Reserved calibration and tests verify the model before the observatory displays comparisons.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3a7383"/></marker></defs><rect width="1280" height="720" fill="#f4f2e9"/><g font-family="Arial,sans-serif" fill="#172d36"><text x="45" y="53" font-size="14" letter-spacing="3">FLUXATLAS / REPRODUCIBLE TRANSPORT RESEARCH</text><text x="45" y="105" font-size="34">Physics first. Learning second. Evidence throughout.</text></g><g fill="none" stroke="#3a7383" stroke-width="2" marker-end="url(#a)"><path d="M305 220H345"/><path d="M605 220H645"/><path d="M175 270V325"/><path d="M775 270V300H475V325"/><path d="M775 270V325"/><path d="M605 375H645"/><path d="M905 375H945"/><path d="M905 220H1075V325"/><path d="M1075 425V480"/><path d="M945 530H905"/><path d="M775 425V480"/><path d="M645 530H605"/><path d="M175 425V480"/><path d="M305 530H345"/><path d="M685 425V455H175V480"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="45" y="170" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="175" y="209" fill="#172d36" font-size="18">Validated experiment</text><text x="175" y="237" fill="#69747a" font-size="12">Geometry / source / synthetic data</text><rect x="345" y="170" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="475" y="209" fill="#172d36" font-size="18">Independent OpenMC</text><text x="475" y="237" fill="#69747a" font-size="12">Means / SE / seeds / fingerprints</text><rect x="645" y="170" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="775" y="209" fill="#172d36" font-size="18">Geometry partitions</text><text x="775" y="237" fill="#69747a" font-size="12">Pool / calibration / test / OOD</text><rect x="45" y="325" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="175" y="364" fill="#172d36" font-size="18">Exact uncollided beam</text><text x="175" y="392" fill="#69747a" font-size="12">Supported-family analytical integral</text><rect x="345" y="325" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="475" y="364" fill="#172d36" font-size="18">Low-history field map</text><text x="475" y="392" fill="#69747a" font-size="12">Training-only POD + kernel ridge</text><rect x="645" y="325" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="775" y="364" fill="#172d36" font-size="18">Residual neural ensemble</text><text x="775" y="392" fill="#69747a" font-size="12">Selected high-history labels only</text><rect x="945" y="325" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="1075" y="364" fill="#172d36" font-size="18">Reserved calibration</text><text x="1075" y="392" fill="#69747a" font-size="12">90% simultaneous MC-target intervals</text><rect x="45" y="480" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="175" y="519" fill="#172d36" font-size="18">Hybrid field sum</text><text x="175" y="547" fill="#69747a" font-size="12">Exact beam + learned scattered field</text><rect x="345" y="480" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="475" y="519" fill="#172d36" font-size="18">Transport observatory</text><text x="475" y="547" fill="#69747a" font-size="12">Replay / local compute / exports</text><rect x="645" y="480" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="775" y="519" fill="#172d36" font-size="18">Independent evaluation</text><text x="775" y="547" fill="#69747a" font-size="12">Baselines / errors / coverage / cost</text><rect x="945" y="480" width="260" height="100" fill="#faf9f4" stroke="#cad5cf"/><text x="1075" y="519" fill="#172d36" font-size="18">Reserved tests + OOD</text><text x="1075" y="547" fill="#69747a" font-size="12">Independent OpenMC fields + SE</text></g><g font-family="Arial,sans-serif" fill="#69747a" font-size="14"><text x="45" y="640">Acquisition loop: ensemble disagreement selects additional high-history training labels from the pool.</text><text x="45" y="667">Calibration and test fields never enter model fitting or acquisition. OOD fields are labeled failure probes.</text><text x="45" y="694">Fixed-grid spatial surrogate · Original synthetic data · No dose or safety-certification claim</text></g></svg>